name: yeeun-week06-btree-gist

services:
  postgres:
    build: .
    container_name: yeeun-week06-btree-gist
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15506:5432"
    volumes:
      - ./sql:/lab/sql:ro
      - week06_pgdata:/var/lib/postgresql/data
    shm_size: "1gb"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d study"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 40s

volumes:
  week06_pgdata:
