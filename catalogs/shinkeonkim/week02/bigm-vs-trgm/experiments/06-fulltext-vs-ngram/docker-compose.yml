name: pg-study-bigmvstrgm-exp06

services:
  postgres:
    build: .
    container_name: pg-study-bigmvstrgm-exp06
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15985:5432"
    command:
      - postgres
      - -c
      - maintenance_work_mem=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d study"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
