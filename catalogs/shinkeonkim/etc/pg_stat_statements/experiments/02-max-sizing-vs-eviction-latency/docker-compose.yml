# 참고용 기본 설정(max=200) - 실제 두 설정 비교는 bench.sh 가 docker run 으로
# 직접 관리한다. max 변경에는 재시작이 필요하며, 스크립트는 매번 새 DB를 만든다.
name: pg-study-pgss-exp02

services:
  postgres:
    build: .
    container_name: pg-study-pgss-exp02
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15951:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d bench"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
