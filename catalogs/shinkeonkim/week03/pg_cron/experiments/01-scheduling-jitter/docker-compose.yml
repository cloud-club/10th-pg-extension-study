name: pg-study-catalog-shinkeonkim-pgcron-exp01

services:
  postgres:
    build: .
    container_name: pg-study-catalog-shinkeonkim-pgcron-exp01
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15952:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=study
      - -c
      - cron.host=/var/run/postgresql
      - -c
      - cron.max_running_jobs=32
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d study"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
