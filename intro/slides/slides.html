/* Pretendard 를 우선 사용한다.
   로컬에 설치되어 있으면 그것을, 없으면 CDN 웹폰트를 쓴다. */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
section {
  font-family: &quot;Pretendard&quot;, &quot;Pretendard Variable&quot;, -apple-system,
               &quot;Apple SD Gothic Neo&quot;, &quot;Noto Sans KR&quot;, &quot;Malgun Gothic&quot;, sans-serif;
}
/* 코드 블록의 아스키 그림(+---+ 박스 등)이 어긋나지 않으려면 한글 글자 폭이
   로마자의 정확히 2배인 고정폭 글꼴이 필요하다. 브라우저 기본 monospace 는
   한글을 다른 글꼴로 대체해 그 비율이 깨진다. Nanum Gothic Coding 은
   로마자·한글 모두 담고 있고 폭 비율이 1:2 라 박스가 그대로 맞는다. */
@import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding&amp;display=swap');
code, pre, pre code {
  font-family: &quot;Nanum Gothic Coding&quot;, &quot;D2Coding&quot;, &quot;SFMono-Regular&quot;, Menlo,
               Consolas, &quot;Noto Sans Mono CJK KR&quot;, monospace;
}
/* ── 제목 영역을 상단에 고정, 그 아래를 콘텐츠 영역으로 ── */
section {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;     /* Marp 기본은 세로 중앙 정렬이라 제목이 흔들린다 */
}
section &gt; h2:first-of-type {
  flex: 0 0 auto;
  min-height: 40px;                /* 제목이 1줄이든 2줄이든 본문 시작 위치를 고정 */
  display: flex;
  align-items: flex-end;
  margin: 0 0 12px;
}
section.lead { justify-content: center; text-align: center; }
section.lead &gt; h2:first-of-type { display: block; min-height: 0; }
/* 장 구분·표지 슬라이드에서는 제목 밑줄을 빼서 여백을 살린다 */
section.lead h2 { border-bottom: none; padding-bottom: 0; }

h1 { color: #1d4ed8; }
h2 { color: #1d4ed8; border-bottom: 2px solid #2563eb; padding-bottom: 4px; }
h3 { color: #1e3a8a; margin-bottom: 8px; }
code { font-size: 0.88em; }
pre { font-size: 0.64em; line-height: 1.28; padding: 6px 10px; }
/* 표가 내용에 맞춰 좁게 잡혀서, 슬라이드 절반이 비는데도 셀 안에서 줄바꿈이 났다.
   원인: section 이 flex 컨테이너인데 display:table 인 요소는 늘어나지 않는다.
   width:100% 로는 해결되지 않고 align-self:stretch 가 필요하다. */
table {
  font-size: 0.76em;
  /* Marp 기본 테마가 table 에 display:block + width:max-content 를 걸어둔다.
     그대로 두면 표가 내용 폭(약 636px)에 맞춰 좁게 잡혀서, 슬라이드 절반이
     비어 있는데도 셀 안에서 줄바꿈이 난다. PDF/PNG 출력에서 특히 그렇다.
     display 와 width 를 되돌려야 폭을 꽉 채운다. */
  display: table !important;
  width: 100% !important;
  align-self: stretch;
}
th, td { word-break: keep-all; }   /* 한글 단어 중간에서 끊기지 않게 */
/* --- 표: Cloud Club 팔레트 --- */
th {
  background: #eff6ff;             /* blue-50 */
  color: #1e3a8a;                  /* blue-900 */
  border-bottom: 2px solid #2563eb;
}
td { border-bottom: 1px solid #e5e7eb; }
tr:nth-child(even) td { background: #f8fafc; }
/* 굵은 글씨를 전부 파랗게 하면 강조가 오히려 죽는다.
   파랑은 제목·표 머리·인용 막대 같은 &quot;구조&quot;에만 쓰고, 강조는 진한 먹색으로 둔다. */
strong { color: #0f172a; }
blockquote strong { color: #1e3a8a; }
/* 인라인 코드는 아주 옅은 회청색 배경 위에 */
code { background: #f1f5f9; color: #1e3a8a; padding: 1px 4px; border-radius: 3px; }
pre code { background: none; color: inherit; padding: 0; }
pre { background: #f8fafc; border-left: 3px solid #93c5fd; }
/* 머리말·꼬리말·쪽번호 */
header, footer { color: #94a3b8; }
section::after { color: #2563eb; font-weight: 600; }
blockquote { border-left: 4px solid #60a5fa; background: #f8fafc; padding: 6px 12px; color: #334155; }
p, ul, ol, table, pre, blockquote { margin-top: 0; margin-bottom: 9px; }
li { margin-bottom: 4px; }
.small { font-size: 0.78em; }

/* ── 장 구분 슬라이드의 목차 ── */
section.lead .agenda {
  /* flex 자식은 inline-block 이 블록으로 바뀌어 폭을 꽉 채운다.
     align-self 로 내용 폭에 맞춰 가운데 정렬한다. */
  align-self: center;
  text-align: left;
  font-size: 0.82em;
  line-height: 1.75;
  color: #444;
  margin: 6px 0 0;
  padding: 14px 26px;
  border-left: 3px solid #93c5fd;
}
section.lead .agenda p { margin: 0; }
section.lead .toc {
  font-size: 0.6em;
  color: #94a3b8;
  line-height: 1.8;
  margin-top: 22px;
  letter-spacing: -0.01em;
}
section.lead .toc b { color: #2563eb; }

/* 다이어그램은 남은 콘텐츠 영역을 꽉 채우되 넘치지 않게 */
section img { display: block; margin: 0 auto; max-width: 100%; max-height: 100%; }
section p:has(&gt; img:only-child) { flex: 1 1 auto; min-height: 0; margin-bottom: 0; }
section p:has(&gt; img:only-child) img { height: 100%; object-fit: contain; }

<p>방금 재현한 그 <code>hstore.sql</code> 이 하고 있던 일이 정확히 그것입니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">FUNCTION</span> hstore_in(cstring) <span class="hljs-keyword">RETURNS</span> hstore
<span class="hljs-keyword">AS</span> <span class="hljs-string">&#x27;$libdir/hstore&#x27;</span>, <span class="hljs-string">&#x27;hstore_in&#x27;</span>     <span class="hljs-comment">-- ← .so 파일 + C 심볼 이름</span>
<span class="hljs-keyword">LANGUAGE</span> C STRICT IMMUTABLE;
</code></pre>
<p>이 문법은 <strong>PostgreSQL 초기부터 있었습니다.</strong> 동적 로딩(<code>dlopen</code>), 함수 관리자(fmgr), <code>PG_MODULE_MAGIC</code> - C extension 을 굴리는 장치는 9.1 이전에 이미 다 있었습니다.</p>

ERROR:  required extension &quot;cube&quot; is not installed
HINT:   Use CREATE EXTENSION ... CASCADE to install required extensions too.

NOTICE:  installing required extension &quot;cube&quot;

</code></pre>

<p>이제 <code>pgcrypto--1.3.sql</code> 파일을 <strong>그냥 SQL 로 실행</strong>합니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-sql"><span class="hljs-comment">-- pgcrypto--1.3.sql 의 일부. 평범한 CREATE FUNCTION 입니다.</span>
<span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">FUNCTION</span> digest(text, text) <span class="hljs-keyword">RETURNS</span> bytea
<span class="hljs-keyword">AS</span> <span class="hljs-string">&#x27;MODULE_PATHNAME&#x27;</span>, <span class="hljs-string">&#x27;pg_digest&#x27;</span>
<span class="hljs-keyword">LANGUAGE</span> C IMMUTABLE STRICT PARALLEL SAFE;

<span class="hljs-keyword">CREATE</span> <span class="hljs-keyword">FUNCTION</span> gen_salt(text) <span class="hljs-keyword">RETURNS</span> text
<span class="hljs-keyword">AS</span> <span class="hljs-string">&#x27;MODULE_PATHNAME&#x27;</span>, <span class="hljs-string">&#x27;pg_gen_salt&#x27;</span>
<span class="hljs-keyword">LANGUAGE</span> C VOLATILE STRICT PARALLEL SAFE;
</code></pre>
<p><code>MODULE_PATHNAME</code> 은 control 파일의 <code>module_pathname</code> 값(<code>$libdir/pgcrypto</code>)으로 <strong>문자열 치환</strong>됩니다.</p>
<p>이게 SQL 함수와 <code>.so</code> 안의 C 함수를 잇는 다리입니다.</p>

</blockquote>

<p>카탈로그에 남는 것은 <strong>&quot;어느 라이브러리의 어느 심볼&quot;이라는 메모</strong>입니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>study=# SELECT proname, probin AS 라이브러리, prosrc AS C심볼
        FROM pg_proc WHERE proname = 'gen_salt' LIMIT 1;

 proname  |   라이브러리     |   C심볼
----------+------------------+-------------
 gen_salt | $libdir/pgcrypto | pg_gen_salt
</code></pre>
<p>다만 <code>CREATE FUNCTION ... LANGUAGE C</code> 는 <strong>그 심볼이 진짜 있는지 확인</strong>합니다. 그래서 설치 스크립트가 도는 동안 <strong>그 세션은 이미 <code>.so</code> 를 <code>dlopen</code></strong> 합니다 (<code>_PG_init()</code> 도 이때 실행). <code>.so</code> 를 치워두고 해보면 바로 드러납니다.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-console">study=# CREATE EXTENSION myext;
ERROR:  could not access file &quot;$libdir/myext&quot;: No such file or directory
</code></pre>
<blockquote>
<p><strong>하지만 로딩은 세션(프로세스)마다입니다.</strong> 설치를 실행한 세션만 읽었을 뿐, <strong>다른 세션들은 아직입니다</strong> - 각자 그 함수를 처음 부를 때 <code>dlopen</code> → <code>dlsym</code> 합니다. 다음 장에서 그 장면을 봅니다.</p>
</blockquote>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code>$ grep -l &quot;trusted = true&quot; $(pg_config --sharedir)/extension/*.control

btree_gin  btree_gist  citext  cube  dict_int  fuzzystrmatch  hstore
intarray   isn  lo  ltree  pgcrypto  pg_trgm  plpgsql  seg
tablefunc  tcn  tsm_system_rows  tsm_system_time  unaccent  uuid-ossp
</code></pre>

<h3 id="%E2%91%A0-pg_module_magic">① <code>PG_MODULE_MAGIC</code></h3>
<p><code>.so</code> 안에 &quot;PostgreSQL 16, 이 컴파일 옵션으로 빌드됨&quot;이라는 블록을 심습니다. 서버가 로드할 때 확인합니다. 안 맞으면 → <code>ERROR: incompatible library</code> <strong>다른 버전용 <code>.so</code> 를 잘못 넣어 서버가 죽는 사고를 막아줍니다.</strong></p>
<h3 id="%E2%91%A1-pg_function_info_v1f">② <code>PG_FUNCTION_INFO_V1(f)</code></h3>
<p><code>pg_finfo_f()</code> 라는 함수를 자동 생성합니다. 서버가 이걸 먼저 호출해 &quot;이 함수는 V1 호출 규약을 쓴다&quot;를 확인합니다.</p>
<h3 id="%E2%91%A2-datum-%EC%8B%9C%EA%B7%B8%EB%8B%88%EC%B2%98">③ <code>Datum</code> 시그니처</h3>
<p>모든 인자와 반환값이 <code>Datum</code> 하나로 통일됩니다. <strong>타입이 몇 개든 함수 시그니처가 항상 같아서</strong> 서버가 균일하게 호출할 수 있습니다.</p>

<p><strong>PostgreSQL 은 연결 하나당 프로세스 하나입니다</strong> (스레드가 아닙니다). <code>postmaster</code> 가 <code>fork()</code> 로 백엔드를 만들고, 그 백엔드가 내 쿼리를 전담합니다.</p>
<table>
<thead>
<tr>
<th>무엇이</th>
<th>어디에</th>
</tr>
</thead>
<tbody>
<tr>
<td>내 쿼리의 임시 메모리</td>
<td><strong>내 백엔드 프로세스</strong>. 쿼리가 끝나면 사라짐</td>
</tr>
<tr>
<td>C extension 의 <code>.so</code></td>
<td><strong>내 백엔드 프로세스</strong>에 <code>dlopen</code>. 세션마다 별도</td>
</tr>
<tr>
<td><code>static</code> 변수</td>
<td><strong>내 백엔드 프로세스</strong>. 다른 세션은 다른 값</td>
</tr>
<tr>
<td><code>shared_buffers</code>, 통계</td>
<td><strong>공유 메모리</strong>. 모든 프로세스가 함께 봄</td>
</tr>
<tr>
<td>pg_cron 스케줄러</td>
<td><strong>별도 프로세스</strong>. 내 세션과 무관하게 계속 돎</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>extension 코드가 &quot;어느 프로세스에서 도는가&quot;에 따라 메모리 수명과 사고 반경이 달라집니다.</strong> 이어지는 장에서 하나씩 봅니다.</p>
</blockquote>

<table>
<thead>
<tr>
<th></th>
<th>SQL-only extension</th>
<th>C extension</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>코드가 도는 곳</strong></td>
<td>SQL 실행기 (인터프리터)</td>
<td>백엔드 프로세스에서 <strong>기계어 직접 실행</strong></td>
</tr>
<tr>
<td><strong>로딩</strong></td>
<td>없음 (카탈로그에 본문이 있음)</td>
<td><code>dlopen()</code> - <strong>세션마다 처음 호출 때</strong></td>
</tr>
<tr>
<td><strong>메모리 할당</strong></td>
<td>실행기가 관리</td>
<td><code>palloc</code> (또는 실수로 <code>malloc</code>)</td>
</tr>
<tr>
<td><strong>전역 상태</strong></td>
<td>없음</td>
<td><code>static</code> 변수 = <strong>세션(프로세스)마다 별개</strong></td>
</tr>
<tr>
<td><strong>잘못 짜면</strong></td>
<td>ERROR 하나</td>
<td><strong>세그폴트 → 서버 전체 재시작</strong></td>
</tr>
<tr>
<td><strong>권한</strong></td>
<td><code>trusted</code> 가능</td>
<td>보통 <code>superuser = true</code></td>
</tr>
</tbody>
</table>
<br />
<blockquote>
<p><code>.so</code> 의 <strong>코드 영역은 OS 가 프로세스 간에 공유</strong>합니다 (같은 파일을 mmap). 하지만 <strong>데이터 영역(<code>static</code> 변수)은 프로세스마다 복사본</strong>을 갖습니다.</p>
</blockquote>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">Datum
<span class="hljs-title function_">myext_hello</span><span class="hljs-params">(PG_FUNCTION_ARGS)</span>
{
    text *name = PG_GETARG_TEXT_PP(<span class="hljs-number">0</span>);
    <span class="hljs-type">char</span> *str  = text_to_cstring(name);   <span class="hljs-comment">/* palloc 으로 할당됨 */</span>
    <span class="hljs-type">char</span>  buf[<span class="hljs-number">256</span>];

    <span class="hljs-built_in">snprintf</span>(buf, <span class="hljs-keyword">sizeof</span>(buf), <span class="hljs-string">&quot;Hello from C, %s!&quot;</span>, str);

}   <span class="hljs-comment">/* pfree 를 부르지 않았지만 누수가 아니다 */</span>
</code></pre>

<blockquote>
<p>그래서 C extension 에서는 <code>malloc</code> 대신 <code>palloc</code> 을 씁니다. <code>malloc</code> 을 쓰면 트랜잭션이 중단돼도 해제되지 않아 <strong>진짜 누수</strong>가 됩니다.</p>
