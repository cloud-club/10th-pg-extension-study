name: pg-study-lab08

services:
  postgres:
    build: .
    container_name: pg-study-lab08-modules
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15408:5432"
    volumes:
      - ./sql:/lab/sql:ro
    command:
      - postgres
      # auto_explain 은 extension 이 아니라 모듈이라 이렇게만 로드할 수 있다
      - -c
      - shared_preload_libraries=auto_explain
      - -c
      - auto_explain.log_min_duration=0      # 0 = 모든 쿼리 (운영에서는 절대 금물)
      - -c
      - auto_explain.log_analyze=on
      - -c
      - auto_explain.log_buffers=on
      # 로그를 파일로 모아 psql 안에서 바로 확인할 수 있게 한다
      - -c
      - logging_collector=on
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d study"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
