name: pg-study-lab07

services:
  postgres:
    build: .
    container_name: pg-study-lab07-hooks
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15407:5432"
    volumes:
      - ./sql:/lab/sql:ro
    # ---------------------------------------------------------------------
    # 이 lab 의 핵심 설정.
    #   왜 Dockerfile 이 아니라 여기인가?
    #   공식 postgres 이미지에서 postgresql.conf 는 데이터 볼륨(PGDATA) 안에 있다.
    #   initdb 가 볼륨을 만들며 생성하므로 Dockerfile 의 COPY 로는 덮어쓸 수 없다.
    #   → command 로 -c 옵션을 주거나, init 스크립트에서 ALTER SYSTEM SET 후 재시작.
    # ---------------------------------------------------------------------
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d study"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
