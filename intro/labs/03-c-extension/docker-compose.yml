name: pg-study-lab03

services:
  postgres:
    build: .
    container_name: pg-study-lab03
    environment:
      POSTGRES_DB: study
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15403:5432"
    volumes:
      - ./sql:/lab/sql:ro
    healthcheck:
      # 유닉스 소켓 대신 TCP 로 확인한다.
      # 첫 기동 시 initdb 용 임시 서버는 TCP 를 열지 않으므로,
      # 이렇게 해야 "진짜" 서버가 뜬 시점을 정확히 잡을 수 있다.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d study"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s

  # 빌드 도구가 다 들어있는 개발용 컨테이너.
  #   docker compose run --rm dev bash   로 들어가 자유롭게 고치고 make 하면 된다.
  #   docker compose --profile dev up -d 로 띄울 수도 있다.
  dev:
    build:
      context: .
      target: build
    container_name: pg-study-lab03-dev
    profiles: ["dev"]
    volumes:
      - ./ext:/build/myext
    working_dir: /build/myext
    command: sleep infinity
